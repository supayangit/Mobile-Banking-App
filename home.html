<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!---tailwind daisy-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
        tailwind.config = {
            plugins: [daisyui],
        }
    </script>

    <!--- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <!--- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--- custom css -->
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex">
                <div class="logo w-[60px]">
                    <img src="assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold"><span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>

            <div class="right">
                <a href="/index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout</a>
            </div>
        </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and</p>

        <div class="buttons grid grid-cols-3 gap-3">
            <button onclick="showSection('add-money')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-1.png" alt="">
                <p class="text-neutral/70">Add Money</p>
            </button>
            <button onclick="showSection('cashout')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-2.png" alt="">
                <p class="text-neutral/70">Cash Out</p>
            </button>
            <button onclick="showSection('send-money')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-3.png" alt="">
                <p class="text-neutral/70">Transfer Money</p>
            </button>
            <button onclick="showSection('bonus')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-4.png" alt="">
                <p class="text-neutral/70">Get Bonus</p>
            </button>
            <button onclick="showSection('paybill')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-5.png" alt="">
                <p class="text-neutral/70">Pay Bill</p>
            </button>
            <button onclick="showSection('history')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img src="assets/opt-6.png" alt="">
                <p class="text-neutral/70">Transactions</p>
            </button>
        </div>
    </section>

    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold">Cashout</h2>
        <div class="form pt-5">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">Agent Number</label>
                        <input id="cashout-number" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter agent number" />
                        <br>
                        <label class="label text-neutral font-bold">Amount</label>
                        <input id="cashout-amount" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter amount" />
                        <br>
                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="cashout-pin" maxlength="4" type="password" class="input rounded-full w-full"
                            placeholder="Enter 4 Digit Pin" />
                        <br>
                        <button id="cashout-btn" class="btn btn-primary rounded-full">Cashout</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="add-money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold">Add Money</h2>
        <div class="form pt-5">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">

                        <label class="label text-neutral font-bold">Select a Bank</label>
                        <select id="add-money-bank" class="select w-full bg-base-200 rounded-full">
                            <option disabled selected>Seclect Bank</option>
                            <option value="DBBL">DBBL</option>
                            <option value="IBBL">IBBL</option>
                            <option value="CITY">City Bank</option>
                        </select>
                        <br>
                        <label class="label text-neutral font-bold">Bank Account Number</label>
                        <input id="add-money-number" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter account number" />
                        <br>
                        <label class="label text-neutral font-bold">Amount to Add</label>
                        <input id="add-money-amount" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter amount to add" />
                        <br>
                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="add-money-pin" maxlength="4" type="password" class="input rounded-full w-full"
                            placeholder="Enter 4 Digit Pin" />
                        <br>
                        <button id="add-money-btn" class="btn btn-primary rounded-full">Add Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="send-money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold">Send Money</h2>
        <div class="form pt-5">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">User Account Number</label>
                        <input id="send-money-number" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter 11 digit number" />
                        <br>
                        <label class="label text-neutral font-bold">Amount</label>
                        <input id="send-money-amount" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter amount" />
                        <br>
                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="send-money-pin" maxlength="4" type="password" class="input rounded-full w-full"
                            placeholder="Enter 4 Digit Pin" />
                        <br>
                        <button id="send-money-btn" class="btn btn-primary rounded-full">Send Money</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="paybill" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold">Pay Bill</h2>
        <div class="form pt-5">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">

                        <label class="label text-neutral font-bold">Select a Target</label>
                        <select id="paybill-target" class="select w-full bg-base-200 rounded-full">
                            <option disabled selected>Seclect Target</option>
                            <option value="Power">Power</option>
                            <option value="Gas">Gas</option>
                            <option value="Wifi">Wifi</option>
                        </select>
                        <br>
                        <label class="label text-neutral font-bold">Bank Account Number</label>
                        <input id="paybill-number" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter account number" />
                        <br>
                        <label class="label text-neutral font-bold">Amount to Pay</label>
                        <input id="paybill-amount" maxlength="11" minlength="11" type="number"
                            class="input rounded-full w-full" placeholder="Enter amount to pay" />
                        <br>
                        <label class="label text-neutral font-bold">4 Digit Pin</label>
                        <input id="paybill-pin" maxlength="4" type="password" class="input rounded-full w-full"
                            placeholder="Enter 4 Digit Pin" />
                        <br>
                        <button id="paybill-btn" class="btn btn-primary rounded-full">Pay Bill</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="bonus" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold">Get Bonus</h2>
        <div class="form pt-5">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-bold">Coupon</label>
                        <input id="bonus-coupon" maxlength="8" minlength="6" type="text"
                            class="input rounded-full w-full" placeholder="Enter coupon" />
                        <br>
                        <button id="bonus-btn" class="btn btn-primary rounded-full">Get Bonus</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </section>

    <section id="history" class="w-11/12 mx-auto py-5 space-y-3 hidden">
        <h2 class="text-xl font-bold">Transaction History</h2>
        <div id="history-container" class="history pt-5 space-y-3">
        </div>
    </section>


    <script src="script/machine.js"></script>
    <script src="script/cashout.js"></script>
    <script src="script/addMoney.js"></script>
    <script src="script/sendmoney.js"></script>
    <script src="script/paybill.js"></script>
    <script src="script/bonus.js"></script>
</body>

</html>
